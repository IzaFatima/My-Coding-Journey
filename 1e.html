<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Practice</title>
    <link rel="stylesheet" href="copystyle.css" />
  </head>
  <body>
    <div class="container">
      <div class="boxes">
        <div class="profile">
          <div class="img-con">
            <img src="/images/autumn.jpg" alt="OLiver the cat" />
          </div>

          <div class="content">
            <div class="name">Oliver</div>
            <div class="details">the cat</div>
            <div class="details">Popular</div>
          </div>
        </div>
        <div class="button-con">
          <button aria-label="Follow Oliver">Follow</button>
        </div>
      </div>
      <div class="boxes">
        <div class="profile">
          <div class="img-con">
            <img src="/images/mountain.jpg" alt="Mimi Sleepy Cat" />
          </div>

          <div class="content">
            <div class="name">Mimi</div>
            <div class="details">Sleepy Cat</div>
            <div class="details">Popular</div>
          </div>
        </div>
        <div class="button-con">
          <button aria-label="Follow Mimi">Follow</button>
        </div>
      </div>
      <div class="boxes">
        <div class="profile">
          <div class="img-con">
            <img src="/images/flower.jpg" alt="Rex Happy Bulldog" />
          </div>

          <div class="content">
            <div class="name">Rex</div>
            <div class="details">Happy Bulldog</div>
            <div class="details">Popular</div>
          </div>
        </div>
        <div class="button-con">
          <button aria-label="Follow Rex">Follow</button>
        </div>
      </div>
    </div>
  </body>
</html>
