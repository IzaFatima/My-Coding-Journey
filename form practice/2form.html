<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form 2</title>
    <link rel="stylesheet" href="2form.css" />
  </head>
  <body>
    <div class="ring">
      <i></i>
      <i></i>
      <i></i>
      <form action="">
        <div class="heading-con">
          <h2 class="heading">Login</h2>
        </div>
        <div class="username-con">
          <input
            type="text"
            name="user-name"
            id="user-name"
            placeholder="Username"
          />
        </div>
        <div class="password-con">
          <input
            type="password"
            name="user-password"
            id="user-password"
            placeholder="Password"
          />
        </div>
        <div class="button-con">
          <button>Sign In</button>
        </div>
        <div class="details">
          <div class="forgot-password">
            <a href="#">Forgot Password</a>
          </div>
          <div class="sign-up"><a href="#">Signup</a></div>
        </div>
      </form>
    </div>
  </body>
</html>
